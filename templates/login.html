<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Customer Ticket</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/styles.min.css') }}">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" 
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">
    
  <div class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
    <div class="d-flex align-items-center justify-content-center w-100">
      <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-4 col-xxl-3">
          <div class="card mb-0">
            <div class="card-body">
              
              <!-- Logo -->
              <a href="" class="text-nowrap logo-img text-center d-block py-3 w-100">
                <img src="{{ url_for('static', filename='assets/images/logos/logo.svg') }}" alt="Logo">
              </a>
              
              <p class="text-center">Your Queue System</p>
              
              <!-- Login Form -->
              <form method="POST">
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fs-4 mb-4 rounded-2">Sign In</button>

              </form>
              
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

</body>

</html>
